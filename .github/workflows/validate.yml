name: validate

# Builds both images and grades the oracle, a do-nothing agent, the shipped
# starter, and one mutant per graded rule. See ci/validate.sh.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Grade oracle, nop, starter and mutants
        run: bash ci/validate.sh
