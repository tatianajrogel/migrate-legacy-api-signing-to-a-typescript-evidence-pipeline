# TB3.0 task manifest.

name = "migrate-legacy-api-signing-to-a-typescript-evidence-pipeline"

# The verifier rebuilds and re-runs the agent's own TypeScript sources against
# held-out request sets, so the whole project directory is declared, not just the
# evidence file the agent writes to /app/out/evidence.ndjson.
artifacts = ["/app/"]

[metadata]
author_name = "Tatiana Rogel"
author_email = "tatianarogel349@gmail.com"

category = "security"
subcategories = ["Long Context"]
tags = ["hmac", "request-signing", "canonicalization", "typescript", "audit-evidence"]
languages = ["TypeScript", "JavaScript", "Bash"]
codebase_size = "small"
number_of_milestones = 0

difficulty = "advanced"
expert_time_estimate_hours = 3

difficulty_explanation = """\
Nowhere in the environment is the signing scheme written down correctly in one \
place. The decision register at /app/dossier/01-decision-register.md is append \
only and says outright that it is not authoritative on its own, but it reads \
like a spec, and 5 of its entries were later reversed in meeting notes \
scattered through about 75k tokens of other migration material. The starter code \
in /app/src/pipeline.ts was written from that register. It compiles. It runs. It \
produces evidence that looks entirely reasonable and every signature in it is \
wrong. That is the trap. An agent that greps for the first rule matching what it \
needs lands exactly where the previous engineer landed. The 5 reversals cover \
raw versus folded header values, query sorting by name alone versus name then \
value, signing only x-gw-* headers versus everything but authorization, the \
UNSIGNED sentinel for empty bodies, and a stray trailing newline on the \
canonical string. Any one of them left unfixed changes every signature, so \
getting 4 right still fails. Another 2 rules never appear in the prose at all. \
The key file carries a trailing newline that is not part of the key, and \
gw-legacy-99.key sits in the key directory while being off the active roster. \
Both facts live only in the strace and lsof captures, and the second one is \
visible only as an absence, the signer lists the directory and then never opens \
that file.\
"""

solution_explanation = """\
Start with the register, notice the warning at the top of it, and go read the \
meeting notes. 3 of them carry the reversals. The 2025-11-04 gateway sync \
switches header values to whitespace folded. The 2025-11-18 addendum changes \
query sorting to name then value because arrival order stopped being \
reproducible behind the load balancer. The 2025-12-02 scheme freeze does 3 \
things at once, widens the signed header set to everything except \
authorization, kills the UNSIGNED sentinel so empty bodies hash normally, and \
drops the trailing newline that was a transcription error in the first place. \
Apply all 5 and the 6 field canonical request comes out right. The last 2 \
rules come from the captures. In the strace each key file is 33 bytes and the \
read hands back all 33, ending in a newline. Only the 32 bytes before that \
newline reproduce the Authorization header on the sample's already signed \
record, so the newline gets stripped. The same trace lists the key directory with getdents64 and then calls \
openat on gw-prod-01 and gw-prod-02 only, and the lsof shows the same 2 files \
held open, which puts gw-legacy-99 off the roster even though it is sitting \
right there on disk. A request naming it gets rejected instead of signed. After \
that the work is routine. HMAC-SHA256 in lowercase hex, sign when there is no \
Authorization header and verify when there is one, and write the evidence fields \
in a fixed order so the bytes come out the same every run.\
"""

verification_explanation = """\
There are 6 ways to fail here and they are independent of each other. The \
evidence at /app/out/evidence.ndjson has to match the approved bytes for the \
shipped requests, and the only route to those bytes is all 5 reversals plus \
the key newline rule. Then the verifier throws away whatever the agent left \
behind, recompiles the agent's own TypeScript, and runs it against 2 request \
sets it has never seen. Both have to come out byte exact. This is the part that \
kills a faked answer, because writing the sample evidence by hand or pinning it \
to the shipped fixtures gets you nothing on inputs you were never shown. Running \
twice on the same input has to give the same bytes. The retired key file gets \
its permissions stripped before a run, and the run has to be completely \
unaffected, which breaks any pipeline that globs the key directory or just \
trusts whatever key id the request hands it. The pipeline also has to produce \
approved bytes with every proxy variable aimed at a dead port, and its sources \
get scanned for network clients, since claiming no network access in a comment \
is not the same as not having any. Last, the 8 evidence records have to \
carry the right outcome and the right rejection reason, which covers signing, a \
successful verification, and all 4 documented rejection paths. All of this \
happens in a separate container built after the agent's is gone, running the \
agent's code as a user that owns nothing outside its own scratch directory.\
"""

relevant_experience = """\
I have spent about 7 years on document intelligence and model evaluation. \
Right now I am a Clinical AI Specialist at iFlipd. Before that I spent 3 and \
a half years as a Document Intelligence Analyst at Arck Interactive, and I \
started out doing NLP and machine learning work at Smarsh. I hold a BS in \
Artificial Intelligence from the University of Portland. Most of my day goes \
into pulling facts out of long, messy source material, clinical notes, scanned \
records, OCR output that came back half wrong, and then proving the extraction \
was actually right instead of just believable. Reviewing model output, hunting \
failure cases, and validating extracted fields against ground truth is the job. \
I built this task around a failure I have watched happen repeatedly. A system \
reads the first authoritative looking statement it finds, never checks whether \
something later overrode it, and produces output that looks completely fine. \
Nobody catches it until someone diffs it against a known good answer. That is \
why the register here is append only and says so, why the reversals sit in \
meeting notes instead, and why 2 of the 7 rules only exist in the syscall \
captures. I graded it on byte exact output across held out inputs for the same \
reason I do that at work. Plausible output and correct output are not the same \
thing, and only one of them survives being checked.\
"""

[verifier]
timeout_sec = 600
# "separate" is required: the verifier runs in its own container built from
# tests/Dockerfile, after the agent's container is torn down. Tests and oracle
# data are therefore never visible to the agent.
environment_mode = "separate"

[agent]
timeout_sec = 3600

[environment]
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 8192
storage_mb = 10240
